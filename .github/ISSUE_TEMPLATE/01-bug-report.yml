name: "问题报告"
description: "报告播放、视频工具或界面问题"
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索现有 Issue，并移除日志中的私人路径、账号和媒体信息。

  - type: input
    id: version
    attributes:
      label: 澄影播放器版本
      placeholder: "例如：0.1.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "例如：macOS 15.6"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Mac 类型
      options:
        - Apple Silicon
        - Intel
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 播放
        - 视频剪辑
        - 逐帧截图
        - 永久旋转
        - 字幕或播放列表
        - 界面或其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 日志、崩溃报告或样例信息
      description: 请勿上传私人视频；如必须提供样例，请使用可公开分享的最小文件并说明编码、分辨率和 HDR 类型。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同问题。
          required: true
        - label: 我已经移除日志中的私人信息。
          required: true
