      - name: Assemble and verify application
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"
          if [[ ! -d "$app_path" ]]; then
            echo "ChengYing.app was not produced." >&2
            exit 1
          fi

          ./other/install_legal_notices.sh "$app_path/Contents/Resources"
          codesign --force --sign - --options runtime --entitlements iina/IINA.entitlements "$app_path"

          for executable in ffmpeg ffprobe chengying-video-tools-helper chengying-subtitle-tools-helper chengying-image-codec chengying-cli; do
            executable_path="$app_path/Contents/MacOS/$executable"
            if [[ ! -x "$executable_path" ]]; then
              echo "$executable was not copied into the application bundle." >&2
              exit 1
            fi
            codesign --verify --strict --verbose=2 "$executable_path"
          done

          download_center="$app_path/Contents/Helpers/DownloadCenter.app"
          for executable in Contents/MacOS/chengying-download-center-helper Contents/Frameworks/playwright/driver/node; do
            if [[ ! -x "$download_center/$executable" ]]; then
              echo "Missing bundled download-center executable: $executable" >&2
              exit 1
            fi
            codesign --verify --strict --verbose=2 "$download_center/$executable"
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"

          PYTHONPATH=other python -c 'import sys; from pathlib import Path; from package_dmg import validate_frozen_helper_signatures; validate_frozen_helper_signatures(Path(sys.argv[1]))' "$app_path"

          app_entitlements="$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements :- "$app_path" > "$app_entitlements" 2>/dev/null
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' "$app_entitlements")" != "true" ]]; then
            echo "The application signature is missing its library validation entitlement." >&2
            exit 1
          fi

          for removed_component in \
            Contents/PlugIns/OpenInIINA.appex \
            Contents/MacOS/iina-plugin \
            Contents/MacOS/youtube-dl \
            Contents/Resources/plugins; do
            if [[ -e "$app_path/$removed_component" || -L "$app_path/$removed_component" ]]; then
              echo "Removed component is still bundled: $removed_component" >&2
              exit 1
            fi
          done

          "$app_path/Contents/MacOS/ffmpeg" -hide_banner -version
          "$app_path/Contents/MacOS/chengying-image-codec" --version
          "$app_path/Contents/MacOS/chengying-video-tools-helper" --help
          "$app_path/Contents/MacOS/chengying-subtitle-tools-helper" --help
          "$download_center/Contents/MacOS/chengying-download-center-helper" --help
          diagnostic_self_test="$RUNNER_TEMP/download-center-self-test.json"
          PATH="$download_center/Contents/MacOS:$PATH" "$download_center/Contents/MacOS/chengying-download-center-helper" --self-test > "$diagnostic_self_test"
          python - "$diagnostic_self_test" "$app_path/Contents/Info.plist" <<'PY'
          import json
          import plistlib
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          app_info = plistlib.loads(Path(sys.argv[2]).read_bytes())
          identity = result.get("diagnostic_identity", {})
          if (result.get("status") != "ok"
              or result.get("diagnostic_log") != "bounded-redacted-export-verified-offline"
              or identity.get("identity_source") != "bundled"
              or identity.get("player_version") != app_info["CFBundleShortVersionString"]
              or identity.get("player_build") != app_info["CFBundleVersion"]):
              raise SystemExit("Frozen diagnostic identity does not match the player application.")
          print("Frozen diagnostic privacy and player identity verified.")
          PY
          python Tools/DownloaderHelper/smoke_helper.py \
            --helper "$download_center/Contents/MacOS/chengying-download-center-helper" \
            --ffmpeg "$app_path/Contents/MacOS/ffmpeg" \
            --ffprobe "$app_path/Contents/MacOS/ffprobe"
          python Tools/SummarySourceTests/smoke_helper.py \
            --helper "$download_center/Contents/MacOS/chengying-download-center-helper" \
            --ffmpeg "$app_path/Contents/MacOS/ffmpeg" \
            --ffprobe "$app_path/Contents/MacOS/ffprobe"
          python Tools/SummarySourceTests/media_smoke.py \
            --ffmpeg "$app_path/Contents/MacOS/ffmpeg" \
            --ffprobe "$app_path/Contents/MacOS/ffprobe"
          if [[ -n "$(find "$download_center" -type d -name '__pycache__' -print -quit)" ]]; then
            echo "The download center wrote bytecode into its signed application bundle." >&2
            exit 1
          fi
          "$app_path/Contents/MacOS/chengying-cli" --help
          helper_output="$RUNNER_TEMP/helper-smoke.jsonl"
          printf '%s\n' '{"id":"shutdown-smoke","command":"shutdown"}' | \
            "$app_path/Contents/MacOS/chengying-video-tools-helper" \
              --ffmpeg "$app_path/Contents/MacOS/ffmpeg" \
              --ffprobe "$app_path/Contents/MacOS/ffprobe" \
              --stdio > "$helper_output"
          grep -Eq '"type"[[:space:]]*:[[:space:]]*"ready"' "$helper_output"
          grep -Eq '"action"[[:space:]]*:[[:space:]]*"shutdown"' "$helper_output"

          subtitle_output="$RUNNER_TEMP/subtitle-helper-smoke.jsonl"
          printf '%s\n' '{"id":"status-smoke","command":"status"}' '{"id":"shutdown-smoke","command":"shutdown"}' | \
            "$app_path/Contents/MacOS/chengying-subtitle-tools-helper" \
              --ffmpeg "$app_path/Contents/MacOS/ffmpeg" \
              --ffprobe "$app_path/Contents/MacOS/ffprobe" \
              --data-dir "$RUNNER_TEMP/subtitle-smoke-data" \
              --stdio > "$subtitle_output"
          grep -Eq '"type"[[:space:]]*:[[:space:]]*"ready"' "$subtitle_output"
          grep -Eq '"type"[[:space:]]*:[[:space:]]*"status"' "$subtitle_output"
          grep -Eq '"runtime_ready"[[:space:]]*:[[:space:]]*false' "$subtitle_output"

          "$app_path/Contents/MacOS/ChengYing" --no-stdin >"$RUNNER_TEMP/chengying-launch.log" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/chengying-launch.log" >&2
            echo "ChengYing exited during the launch smoke test." >&2
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          if [[ "$bundle_id" != "io.github.SeanLi-Coder.ChengYingPlayer" ]]; then
            echo "Unexpected bundle identifier: $bundle_id" >&2
            exit 1
          fi
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          expected_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' Configs/Deployment.xcconfig)"
          if [[ -z "$expected_version" || "$bundle_version" != "$expected_version" ]]; then
            echo "Unexpected bundle version: $bundle_version (expected ${expected_version:-<missing>})." >&2
            exit 1
          fi
          legal_dir="$app_path/Contents/Resources/Legal"
          for legal_file in \
            ChengYingPlayer-GPLv3.txt \
            ChengYingPlayer-NOTICE.md \
            THIRD_PARTY_NOTICES.md \
            SOURCE_MANIFEST.txt \
            FFmpeg-COPYING.GPLv3.txt \
            FFmpeg-LICENSE.md \
            x264-COPYING.txt \
            x265-COPYING.txt \
            FreeType-FTL.txt \
            FreeType-GPLv2.txt \
            HarfBuzz-COPYING.txt \
            FriBidi-COPYING.txt \
            libunibreak-LICENCE.txt \
            libass-COPYING.txt \
            libwebp/COPYING.txt \
            libwebp/PATENTS.txt \
            libwebp/AUTHORS.txt \
            CPython-LICENSE.txt \
            CPython-THIRD-PARTY-NOTICES.rst \
            Just-LICENSE.md \
            PromiseKit-LICENSE.txt \
            GRMustache-LICENSE.txt \
            Sparkle-LICENSE.txt \
            PyInstaller-COPYING.txt \
            PyInstaller-hooks-contrib-LICENSE.txt \
            PyInstaller-waflib-LICENSE.txt \
            PyInstaller-zlib-LICENSE.txt \
            altgraph-LICENSE.txt \
            macholib-LICENSE.txt \
            packaging-LICENSE.txt \
            packaging-LICENSE.APACHE.txt \
            packaging-LICENSE.BSD.txt \
            setuptools-LICENSE.txt; do
            if [[ ! -s "$legal_dir/$legal_file" ]]; then
              echo "Missing bundled legal notice: $legal_file" >&2
              exit 1
            fi
          done
          for legal_file in runtime-artifacts.json RednoteDownloader-MIT-LICENSE.txt DISTRIBUTION.md \
            playwright/playwright/driver/LICENSE playwright/playwright/driver/package/NOTICE; do
            if [[ ! -s "$legal_dir/DownloadCenter/$legal_file" ]]; then
              echo "Missing download-center legal notice: $legal_file" >&2
              exit 1
            fi
          done

      - name: Test signed update archives and feed rejection
        timeout-minutes: 10
        run: |
          export SPARKLE_TEST_ROOT="$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle"
          bash Tools/SparkleUpdateTests/run.sh
          python -B Tools/SparkleUpdateTests/test_delta_builder.py

      - name: Test native update interface and state transitions
        timeout-minutes: 5
        run: |
          python3 -B Tools/AppUpdateTests/test_runner.py
          export SPARKLE_FRAMEWORK_DIR="$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64"
          bash Tools/AppUpdateTests/run.sh

      - name: Test real signed update installation and relaunch
        timeout-minutes: 15
        run: |
          python3 -B Tools/AppUpdateIntegrationTests/test_waiter.py
          export SPARKLE_TEST_ROOT="$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle"
          export SPARKLE_INSTALLED_APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"
          python -B Tools/AppUpdateIntegrationTests/run.py
          python -B Tools/AppUpdateIntegrationTests/run.py --scenario tampered-dmg
          python -B Tools/AppUpdateIntegrationTests/run.py --scenario delta-upgrade
          python -B Tools/AppUpdateIntegrationTests/run.py --scenario tampered-delta
          python -B Tools/AppUpdateIntegrationTests/run.py --scenario mismatched-delta
          python -B Tools/AppUpdateIntegrationTests/run.py --scenario tampered-delta-and-dmg

      - name: Test real application loop boundaries
        timeout-minutes: 5
        run: >-
          python Tools/VideoToolsTests/app_loop_smoke.py
          --app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"

      - name: Test packaged video conversion
        timeout-minutes: 5
        run: >-
          python Tools/VideoToolsTests/app_conversion_smoke.py
          --app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"

      - name: Test packaged precise Dolby Vision clipping
        timeout-minutes: 5
        run: >-
          python -B Tools/VideoToolsTests/app_dolby_clip_smoke.py
          --app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"

      - name: Test packaged precise HDR10+ clipping
        timeout-minutes: 5
        run: >-
          python -B Tools/VideoToolsTests/app_hdr10plus_clip_smoke.py
          --app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"

      - name: Test real application rapid rotation preview
        timeout-minutes: 5
        run: >-
          python -B Tools/VideoToolsTests/app_rotation_smoke.py
          --app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"
          --mode ipc --hwdec no --rounds 12

      - name: Package and verify Apple Silicon DMG
        id: dmg
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          dmg_path="$RUNNER_TEMP/ChengYingPlayer-v${app_version}-Apple-Silicon.dmg"
          bash other/package_dmg.sh "$app_path" "$dmg_path"
          {
            echo "path=$dmg_path"
            echo "checksum=${dmg_path}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Retain an explicitly requested unreleased verification build
        if: github.event_name == 'workflow_dispatch' && inputs.upload_development_build && !startsWith(github.ref, 'refs/tags/') && github.repository == 'SeanLi-Coder/ChengYingPlayer'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-unreleased-${{ github.sha }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.checksum }}
          retention-days: 3
          if-no-files-found: error

      - name: Download the immutable previous stable delta base
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'SeanLi-Coder/ChengYingPlayer'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B other/download_previous_release.py \
            --tag "$GITHUB_REF_NAME" \
            --output-directory "$RUNNER_TEMP/previous-update"

      - name: Build verified delta and sign the release update feed
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'SeanLi-Coder/ChengYingPlayer'
        timeout-minutes: 55
        id: appcast
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python -B other/generate_update_feed.py \
            --app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app" \
            --archive "${{ steps.dmg.outputs.path }}" \
            --output "$RUNNER_TEMP/appcast.xml" \
            --tag "$GITHUB_REF_NAME" \
            --previous-release-directory "$RUNNER_TEMP/previous-update" \
            --sparkle-root "$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle"
          echo "path=$RUNNER_TEMP/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Verify the update with the previous stable client's public key
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'SeanLi-Coder/ChengYingPlayer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/Configs/Deployment.xcconfig" \
            -f "ref=$latest_tag" > "$RUNNER_TEMP/previous-release-config.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/iina/Info.plist" \
            -f "ref=$latest_tag" > "$RUNNER_TEMP/previous-release-info.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/Configs/iina.xcconfig" \
            -f "ref=$latest_tag" > "$RUNNER_TEMP/previous-project-config.json"
          python3 -B other/validate_release_progress.py \
            --previous-tag "$latest_tag" --tag "$GITHUB_REF_NAME" \
            --previous-configuration "$RUNNER_TEMP/previous-release-config.json" \
            --previous-info "$RUNNER_TEMP/previous-release-info.json" \
            --info-plist iina/Info.plist \
            --previous-project-configuration "$RUNNER_TEMP/previous-project-config.json" \
            --project-configuration Configs/iina.xcconfig \
            --built-info-plist "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app/Contents/Info.plist" \
            --appcast "${{ steps.appcast.outputs.path }}"

      - name: Package release source
        if: startsWith(github.ref, 'refs/tags/')
        id: package
        run: |
          set -euo pipefail
          build_label="$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')"
          if [[ -z "$build_label" ]]; then
            build_label="${GITHUB_SHA:0:12}"
          fi
          source_archive="$RUNNER_TEMP/ChengYingPlayer-${build_label}-Release-Source.tar.gz"
          SOURCE_REF="$GITHUB_SHA" ./other/package_release_source.sh "$source_archive"
          tar -tzf "$source_archive" >/dev/null
          source_archive_name="$(basename "$source_archive")"
          source_checksum="${source_archive}.sha256"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$source_archive_name" > "${source_archive_name}.sha256")
          source_manifest="$RUNNER_TEMP/ChengYingPlayer-${build_label}-Third-Party-Source-Manifest.txt"
          source ./other/third_party_sources.sh
          write_third_party_source_manifest "$source_manifest"
          {
            echo "source_archive=$source_archive"
            echo "source_checksum=$source_checksum"
            echo "source_manifest=$source_manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified release artifacts
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'SeanLi-Coder/ChengYingPlayer'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChengYingPlayer-macOS-Release
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.checksum }}
            ${{ steps.package.outputs.source_archive }}
            ${{ steps.package.outputs.source_checksum }}
            ${{ steps.package.outputs.source_manifest }}
            ${{ steps.appcast.outputs.path }}
            ${{ runner.temp }}/*.delta
            ${{ runner.temp }}/*.delta.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'SeanLi-Coder/ChengYingPlayer'
    needs: [media-helper-tests, build-apple-silicon]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: chengying-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ChengYingPlayer-macOS-Release
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*-Release-Source.tar.gz)
          dmgs=(dist/*-Apple-Silicon.dmg)
          checksums=(dist/*.sha256)
          manifests=(dist/*-Third-Party-Source-Manifest.txt)
          appcasts=(dist/appcast.xml)
          deltas=(dist/*.delta)
          if (( ${#archives[@]} != 1 || ${#dmgs[@]} != 1 || ${#checksums[@]} != 2 + ${#deltas[@]} || ${#manifests[@]} != 1 )) || [[ ! -s dist/appcast.xml ]]; then
            echo "Expected the full six release assets plus every signed delta and checksum." >&2
            find dist -maxdepth 2 -type f -print >&2
            exit 1
          fi
          for expected_asset in \
            "ChengYingPlayer-${GITHUB_REF_NAME}-Apple-Silicon.dmg" \
            "ChengYingPlayer-${GITHUB_REF_NAME}-Apple-Silicon.dmg.sha256" \
            "ChengYingPlayer-${GITHUB_REF_NAME}-Release-Source.tar.gz" \
            "ChengYingPlayer-${GITHUB_REF_NAME}-Release-Source.tar.gz.sha256" \
            "ChengYingPlayer-${GITHUB_REF_NAME}-Third-Party-Source-Manifest.txt" \
            "appcast.xml"; do
            test -s "dist/$expected_asset"
          done
          for checksum in "${checksums[@]}"; do
            (cd dist && sha256sum --check "$(basename "$checksum")")
          done
          python3 - "$GITHUB_REF_NAME" > "$RUNNER_TEMP/expected-assets.txt" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "other")
          from release_delivery import asset_names, delta_manifest

          directory = Path("dist")
          feed = (directory / "appcast.xml").read_bytes()
          names = asset_names(sys.argv[1], feed)
          if {path.name for path in directory.iterdir()} != set(names):
              raise SystemExit("Release artifact set differs from the signed update manifest.")
          delta_manifest(sys.argv[1], feed, directory)
          print("\n".join(names))
          PY
          mapfile -t allowed_assets < "$RUNNER_TEMP/expected-assets.txt"
          release_assets=()
          for asset in "${allowed_assets[@]}"; do
            test -s "dist/$asset"
            release_assets+=("dist/$asset")
          done

          # Serialize publication and never move the stable feed to an older version.
          latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/Configs/Deployment.xcconfig" \
            -f "ref=$latest_tag" > "$RUNNER_TEMP/previous-release-config.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/iina/Info.plist" \
            -f "ref=$latest_tag" > "$RUNNER_TEMP/previous-release-info.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/Configs/iina.xcconfig" \
            -f "ref=$latest_tag" > "$RUNNER_TEMP/previous-project-config.json"
          python3 -B other/validate_release_progress.py \
            --previous-tag "$latest_tag" --tag "$GITHUB_REF_NAME" \
            --previous-configuration "$RUNNER_TEMP/previous-release-config.json" \
            --previous-info "$RUNNER_TEMP/previous-release-info.json" \
            --info-plist iina/Info.plist \
            --previous-project-configuration "$RUNNER_TEMP/previous-project-config.json" \
            --project-configuration Configs/iina.xcconfig \
            --appcast dist/appcast.xml

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Refusing to modify an already published release; use a new version tag." >&2
              exit 1
            fi
            mapfile -t existing_assets < <(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )
            for existing_asset in "${existing_assets[@]}"; do
              allowed=false
              for allowed_asset in "${allowed_assets[@]}"; do
                if [[ "$existing_asset" == "$allowed_asset" ]]; then
                  allowed=true
                  break
                fi
              done
              if [[ "$allowed" != true ]]; then
                echo "Refusing to overwrite a release with an unexpected asset: $existing_asset" >&2
                echo "Review the existing release assets before retrying." >&2
                exit 1
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "澄影视界 $GITHUB_REF_NAME · Apple Silicon" \
              --verify-tag \
              --notes "下载 Apple-Silicon.dmg，打开后将 ChengYing 拖到 Applications 即可安装，支持 M4 Max 等 Apple Silicon Mac。无需 Homebrew 或 Python。此版本使用 ad-hoc 签名，尚未经过 Apple 公证；首次打开可能需要在系统设置 → 隐私与安全性中选择‘仍要打开’，无需关闭 Gatekeeper。macOS 12+ 可使用本地播放/编辑，下载中心需要 macOS 13.5+ 及自行安装的 Google Chrome。Release-Source.tar.gz 是与此版本对应的应用源码、播放组件和依赖源码及构建记录，不是安装包。"
          fi

          # Retry only missing assets; never overwrite an existing remote asset.
          python3 -B other/release_delivery.py upload --tag "$GITHUB_REF_NAME" --directory dist

          # Draft releases are not available through the REST release-by-tag endpoint.
          # Resolve one exact tag across all pages, then verify that same release by ID.
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          release_id="$(
            python3 - "$RUNNER_TEMP/releases.json" "$GITHUB_REF_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text())
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("The release-list response has an unexpected format.")
          releases = [release for page in pages for release in page]
          if any(not isinstance(release, dict) for release in releases):
              raise SystemExit("The release-list response contains an invalid release.")
          matches = [release for release in releases if release.get("tag_name") == sys.argv[2]]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one release for the requested tag.")
          release = matches[0]
          if release.get("draft") is not True or release.get("prerelease") is not False or type(release.get("id")) is not int or release["id"] <= 0:
              raise SystemExit("Refusing to publish a non-stable draft release or an invalid release ID.")
          print(release["id"])
          PY
          )"
          gh api --method GET "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$release_id" "$GITHUB_REF_NAME" "${release_assets[@]}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "other")
          from release_delivery import asset_names

          release = json.loads(Path(sys.argv[1]).read_text())
          expected = {Path(path).name: Path(path) for path in sys.argv[4:]}
          required_names = asset_names(sys.argv[3], expected["appcast.xml"].read_bytes())
          assets = release["assets"]
          if release.get("id") != int(sys.argv[2]) or release.get("tag_name") != sys.argv[3] or release.get("draft") is not True or release.get("prerelease") is not False:
              raise SystemExit("The resolved release identity or draft state changed before verification.")
          if set(expected) != set(required_names) or len(assets) != len(expected) or {asset["name"] for asset in assets} != set(expected):
              raise SystemExit("The draft release does not contain exactly the verified asset set.")
          for asset in assets:
              path = expected[asset["name"]]
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              if asset["state"] != "uploaded" or asset["size"] != path.stat().st_size or asset.get("digest") != f"sha256:{digest}":
                  raise SystemExit(f"Uploaded release asset failed integrity verification: {path.name}")
          print("All full and delta update assets, source, checksums and signed appcast are complete and verified.")
          PY
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          python3 -B other/release_delivery.py verify-public \
            --tag "$GITHUB_REF_NAME" --appcast dist/appcast.xml --archive "${dmgs[0]}"
