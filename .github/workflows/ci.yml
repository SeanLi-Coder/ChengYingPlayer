name: Build, test, and publish macOS release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_development_build:
        description: "Retain an unreleased build for isolated application verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  media-helper-tests:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate application icons
        run: ./other/update_app_icons.sh --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: |
            Tools/VideoToolsHelper/requirements-dev.txt
            Tools/DownloaderHelper/requirements-dev.txt
            Tools/DownloaderHelper/requirements-runtime.txt

      - name: Test automatic-update release continuity and delivery policy
        run: |
          python3 -B Tools/SparkleUpdateTests/test_release_policy.py
          python3 -B Tools/SparkleUpdateTests/test_release_delivery.py
          python3 -B Tools/SparkleUpdateTests/test_delta_assets.py
          python3 -B Tools/SparkleUpdateTests/test_app_workspace.py
          CHENGYING_RUN_LAUNCHSERVICES_TESTS=1 python3 -B Tools/SparkleUpdateTests/test_app_workspace.py LaunchServicesIntegrationTests
          python3 -B Tools/SparkleUpdateTests/test_public_workspace.py

      - name: Test pinned playback source downloads
        run: python3 -B Tools/PlaybackBuildTests/test_sources.py

      - name: Install test dependencies
        run: |
          brew install ffmpeg
          python -m pip install --require-hashes --only-binary=:all: --requirement Tools/DownloaderHelper/requirements-dev.txt

      - name: Test media helper
        working-directory: Tools/VideoToolsHelper
        run: |
          python -m ruff check helper.py media.py conversion.py dovi_clip.py hdr10plus_clip.py tests ../VideoToolsTests/app_conversion_smoke.py ../VideoToolsTests/app_dolby_clip_smoke.py ../VideoToolsTests/app_hdr10plus_clip_smoke.py ../VideoToolsTests/app_rotation_smoke.py ../VideoToolsTests/test_rotation_smoke.py ../PlaybackRotationTests
          python -m pytest -q
          python -B ../VideoToolsTests/test_rotation_smoke.py
          python -B ../PlaybackRotationTests/test_pipeline.py

      - name: Preflight native media information UI and image metadata
        run: |
          python Tools/MediaInfoTests/LocalizationTests.py
          bash Tools/MediaInfoTests/ImageRun.sh
          bash Tools/MediaInfoTests/RoutingRun.sh
          bash Tools/MediaInfoTests/WindowTests.sh

      - name: Test native playback controls
        run: |
          ./Tools/VideoToolsTests/run.sh
          python3 -B Tools/VideoToolsTests/run.py --language en --preview-case handoff-busy
          python3 -B Tools/ClipPreviewNavigationTests/run.py
          bash Tools/VideoWindowSizingTests/run.sh
          bash Tools/VideoViewportTests/run.sh
          bash Tools/HDRPreferenceTests/run.sh
          bash Tools/HDRColorStateTests/run.sh
          bash Tools/PlaybackModeTests/run.sh
          bash Tools/PlaybackModeUITests/run.sh

      - name: Test edge player controls and visibility lifecycle
        run: |
          bash Tools/PlayerChromeTests/run.sh
          bash Tools/PlayerChromeInteractionTests/run.sh
          bash Tools/PlayerChromeLifecycleTests/run.sh
          bash Tools/PlayerChromeIntegrationTests/run.sh

      - name: Test update activity barriers and helper shutdown
        run: bash Tools/UpdateActivityTests/run.sh

      - name: Test DMG packaging safety
        run: |
          bash Tools/DMGPackagingTests/run.sh
          bash Tools/PlaybackDistributionTests/run.sh
          python Tools/RenderTestSupport/test_policy.py

      - name: Test inherited player bug regressions
        run: |
          bash Tools/PlaybackTimeTests/run.sh
          bash Tools/HistorySearchTests/run.sh
          bash Tools/PlaybackLifecycleTests/run.sh
          bash Tools/ThumbnailLifecycleTests/run.sh
          bash Tools/ThumbnailCacheTests/run.sh
          python3 -B Tools/NowPlayingArtworkTests/run.py --sanitize address
          python3 -B Tools/NowPlayingArtworkTests/run.py --sanitize thread
          python3 -B Tools/NowPlayingArtworkTests/run.py --negative-control
          bash Tools/RenderLifecycleTests/run.sh
          python3 -B Tools/PlayerCloseTests/run.py --priority
          bash Tools/WindowLifecycleTests/run.sh
          bash Tools/AutoFileMatchingTests/run.sh
          bash Tools/PlaybackUIPerformanceTests/run.sh
          python3 -B Tools/SeekTimingTests/run.py

      - name: Test media-open cancellation before playlist admission
        run: |
          python3 -B Tools/MediaOpenAdmissionTests/run.py
          python3 -B Tools/MediaOpenAdmissionTests/run.py --sanitize address
          python3 -B Tools/MediaOpenAdmissionTests/run.py --sanitize thread
          python3 -B Tools/MediaOpenAdmissionTests/run.py --negative-late-cancel
          python3 -B Tools/MediaOpenAdmissionTests/run.py --negative-post-append

      - name: Preserve media-open admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-open-admission-evidence-${{ github.sha }}
          path: |
            build/media-open-admission.*/*.json
            build/media-open-admission.*/*.sha256
            build/media-open-admission.*/*.log
            build/media-open-admission.*/exit-status.txt
            build/media-open-admission.*/test-exit-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Test simplified player features
        run: |
          ./Tools/SimplificationTests/run.sh
          bash Tools/PreferenceSearchTests/run.sh

      - name: Test native visual design
        run: |
          bash Tools/VisualStyleTests/run.sh
          bash Tools/WelcomeDesignTests/run.sh
          bash Tools/FileAccessTests/run.sh

      - name: Test folder playlists and Finder tags
        run: |
          bash Tools/PlaylistMetadataTests/run.sh
          bash Tools/PlaylistPlaybackTests/run.sh
          bash Tools/PlaylistPresentationTests/run.sh
          bash Tools/PlaylistFilterTests/run.sh
          bash Tools/MediaFolderBrowserTests/run.sh
          bash Tools/MediaFileTransferTests/run.sh
          bash Tools/MediaFileActionsTests/run.sh

      - name: Test native image viewing and conversion
        run: |
          brew install cmake
          bash other/build_image_codec.sh
          bash Tools/ImageCodecHelper/run.sh
          bash Tools/ImageViewerTests/run.sh
          bash Tools/ImageEditingTests/run.sh
          bash Tools/ImageCropTests/run.sh
          bash Tools/ImageViewerUITests/run.sh
          bash Tools/ImageRoutingTests/run.sh
          bash Tools/ImageSlideshowTests/run.sh
          bash Tools/ImageSlideshowUITests/run.sh

      - name: Test local subtitle and summary tools
        run: |
          python -m ruff check Tools/SubtitleToolsHelper Tools/SummarySourceTests
          python -m pytest -q Tools/SubtitleToolsHelper/tests
          ./Tools/SubtitleToolsTests/run.sh
          bash Tools/SummaryToolsTests/run.sh
          python Tools/SummarySourceTests/media_smoke.py \
            --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"

      - name: Test preserved downloader engine
        run: python Tools/DownloaderHelper/run_upstream_tests.py

      - name: Test private download-center adapter
        run: |
          node Tools/DownloaderProxyUITests/main.mjs
          node Tools/DownloaderChromeProfilesUITests/main.mjs
          node Tools/DownloaderDiagnosticsUITests/main.mjs
          node Tools/DownloaderOutputIndexTests/main.mjs
          python -m ruff check Tools/DownloaderHelper --exclude vendor
          CHENGYING_REQUIRE_CHROME_UI=1 python -m pytest -q -rs Tools/DownloaderHelper/tests
          python Tools/DownloaderHelper/smoke_helper.py \
            --helper Tools/DownloaderHelper/helper.py \
            --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"
          python Tools/SummarySourceTests/smoke_helper.py \
            --helper Tools/DownloaderHelper/helper.py \
            --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)"
          bash Tools/DownloadCenterTests/run.sh

  build-apple-silicon:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      ARCHS: arm64
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"
          app_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' Configs/Deployment.xcconfig)"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match MARKETING_VERSION ${app_version:-<missing>}." >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: |
            Tools/VideoToolsHelper/requirements-build.txt
            Tools/VideoToolsHelper/requirements-dev.txt
            Tools/DownloaderHelper/requirements-build.txt
            Tools/DownloaderHelper/requirements-runtime.txt

      - name: Install build dependencies
        run: |
          # Homebrew FFmpeg is a test-only independent AV1 reference. Shipped
          # playback/helper binaries are still built from their pinned sources.
          brew install cmake pkg-config meson ninja autoconf automake libtool ffmpeg
          python -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python" -m pip install --require-hashes --only-binary=:all: --requirement Tools/DownloaderHelper/requirements-build.txt
          python -m venv "$RUNNER_TEMP/media-test-python"
          "$RUNNER_TEMP/media-test-python/bin/python" -m pip install --require-hashes --only-binary=:all: --requirement Tools/VideoToolsHelper/requirements-dev.txt
          echo "$RUNNER_TEMP/build-python/bin" >> "$GITHUB_PATH"

      - name: Test rotation teardown with original and patched playback source
        run: bash Tools/PlaybackRotationTests/run_source.sh

      - name: Build playback libraries from pinned source
        run: |
          python3 -B Tools/PlaybackBuildTests/test_sources.py
          bash other/build_playback_libraries.sh
          python3 -B other/patches/test_scaler_lut.py
          bash Tools/PlaybackBuildTests/run.sh
          python other/verify_playback_distribution.py "$PWD/deps"
          bash Tools/RenderTestSupport/test_native_capability.sh

      - name: Test real ICC profile memory ownership
        run: bash Tools/ICCProfileTests/run.sh

      - name: Test actual HDR-to-SDR rendering
        run: bash Tools/HDRRenderingTests/run.sh

      - name: Test Dolby Vision compatible base-layer source regression
        run: bash Tools/HDRSourceTests/run.sh

      - name: Build bundled video tools
        run: |
          ./other/build_media_binaries.sh
          python3 -B other/verify_media_distribution.py "$PWD/deps"
          python3 -B Tools/HDR10PlusCodecTests/test_codec.py
          python3 -B Tools/HDR10PlusCodecTests/test_distribution.py
          PYTHONPATH="$PWD/Tools/VideoToolsHelper" PATH="$PWD/deps/executable:$PATH" "$RUNNER_TEMP/media-test-python/bin/python" -B -m pytest -q Tools/VideoToolsHelper/tests/test_hdr10plus_clips.py
          bash other/build_image_codec.sh
          HELPER_PYTHON=python HELPER_TARGET_ARCH=arm64 Tools/VideoToolsHelper/build_helper.sh
          HELPER_PYTHON=python HELPER_TARGET_ARCH=arm64 Tools/SubtitleToolsHelper/build_helper.sh
          HELPER_PYTHON=python HELPER_TARGET_ARCH=arm64 Tools/DownloaderHelper/build_helper.sh

      - name: Test screenshot defaults, retained preferences, and real JPG exports
        timeout-minutes: 5
        run: bash Tools/ScreenshotPreferenceTests/run.sh

      - name: Test automatic seek sampling with actual libmpv events
        timeout-minutes: 5
        run: python3 -B Tools/SeekTimingTests/run.py --live

      - name: Test real rotation at EOF, stop, and file replacement
        timeout-minutes: 5
        run: bash Tools/PlaybackRotationTests/run.sh

      - name: Verify frozen helper signing after Xcode-style copying
        run: |
          sw_vers
          csrutil status
          bash Tools/HelperSigningTests/run.sh

      - name: Test native media information with bundled FFprobe
        run: bash Tools/MediaInfoTests/run.sh

      - name: Test nested download-center signing
        run: |
          python Tools/DownloaderHelper/smoke_signing.py \
            --app deps/download-center/DownloadCenter.app \
            --ffmpeg "$PWD/deps/executable/ffmpeg" --ffprobe "$PWD/deps/executable/ffprobe"

      - name: Test live playlist reordering
        run: PATH="$PWD/deps/executable:$PATH" PLAYLIST_REQUIRE_LIVE_TESTS=1 bash Tools/PlaylistPlaybackTests/run.sh

      - name: Test real playback mode transitions and EOF
        run: PATH="$PWD/deps/executable:$PATH" bash Tools/PlaybackModeLiveTests/run.sh

      - name: Test automatic clip previews with native editing and real rendered video
        timeout-minutes: 5
        run: python3 -B Tools/ClipPreviewLiveTests/run.py

      - name: Test live filter node safety
        run: bash Tools/PlaybackLifecycleTests/run_live.sh

      - name: Test real rendering while closing and reopening 4K video windows
        timeout-minutes: 10
        run: |
          python3 -B Tools/PlayerCloseTests/test_load_waiter.py
          python3 -B Tools/PlayerCloseTests/test_window_lifecycle.py
          CHENGYING_TEST_SOFTWARE_GL=1 python3 -B Tools/PlayerCloseTests/run.py

      - name: Test silent video opening before audio output
        run: PATH="$PWD/deps/executable:$PATH" bash Tools/SilentVideoOpenTests/run.sh

      - name: Test real thumbnail decoding and cancellation
        run: bash Tools/ThumbnailDecoderTests/run.sh

      - name: Test real 4K playback rendering
        run: CHENGYING_ALLOW_CI_GL_SKIP=1 PLAYBACK_SOAK_MODE=software PLAYBACK_SOAK_SECONDS=180 bash Tools/PlaybackSoakTests/run.sh

      - name: Test real video picture zoom and pan
        run: |
          CHENGYING_ALLOW_CI_GL_SKIP=1 VIDEO_VIEWPORT_LIVE_MODE=software bash Tools/VideoViewportTests/Live/run.sh
          CHENGYING_ALLOW_CI_GL_SKIP=1 CHENGYING_VIEWPORT_TEST_DROP_RESET_REDRAW=1 VIDEO_VIEWPORT_LIVE_MODE=software bash Tools/VideoViewportTests/Live/run.sh

      - name: Build application
        id: native_build
        run: >-
          xcodebuild
          -project iina.xcodeproj
          -scheme iina
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          ONLY_ACTIVE_ARCH=YES
          ARCHS=arm64
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=YES

      # Exercise complete-app wiring before the longer isolated suites so a
      # development candidate exposes integration failures as soon as it builds.
      - name: Test native playback in the complete application window
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 20
        run: |
          python3 -B Tools/NativeAppTests/test_runner.py
          bash Tools/NativeAppTests/run_paused_probe.sh
          python3 -B Tools/NativeAppTests/run.py \
            --include-queue \
            --include-resume \
            --source-packages "$RUNNER_TEMP/SourcePackages" \
            --production-app "$RUNNER_TEMP/DerivedData/Build/Products/Release/ChengYing.app" \
            --report-directory "$PWD/build/native-app-ci-report"

      - name: Preserve complete native application test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-app-test-evidence-${{ github.sha }}
          path: |
            build/native-app-ci-report/
            build/native-app-paused-wait.*/*.txt
            build/native-app-paused-wait.*/*.log
            build/native-app-paused-wait.*/*.json
            build/native-app-paused-wait.*/*/*.log
            build/native-app-paused-wait.*/*/*.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Test independent native playback backend
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 6
        run: |
          export FFMPEG_BIN="$PWD/deps/executable/ffmpeg"
          python3 -B Tools/RenderTestSupport/test_native_dependencies.py
          bash Tools/NativeDecoderTests/run.sh
          bash Tools/NativeSampleBufferOutputTests/run.sh
          bash Tools/NativeSampleBufferDisplayTests/run.sh
          bash Tools/NativePlaybackSessionTests/run.sh
          bash Tools/NativePlaybackRenderedTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativePlaybackSessionTests/run.sh

      - name: Test native exact seek cooperative scheduling
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 8
        run: |
          export FFMPEG_BIN="$PWD/deps/executable/ffmpeg"
          python3 -B Tools/NativeSeekLatencyTests/test_evidence.py
          python3 -B Tools/NativeSeekLatencyTests/test_gate.py
          for sanitizer in "" address thread; do
            positive_log="$(mktemp "$RUNNER_TEMP/native-seek-positive.XXXXXX")"
            set +e
            NATIVE_PLAYBACK_SANITIZER="$sanitizer" bash Tools/NativeSeekLatencyTests/run.sh > "$positive_log" 2>&1
            positive_status=$?
            set -e
            cat "$positive_log"
            test "$positive_status" -eq 0
            positive_dir="$(sed -n 's/^Artifacts: //p' "$positive_log" | tail -1)"
            python3 -B Tools/NativeSeekLatencyTests/verify.py evidence "$positive_dir"
          done
          for negative in polling busy-wait quantum fifo; do
            negative_log="$(mktemp "$RUNNER_TEMP/native-seek-negative.XXXXXX")"
            set +e
            NATIVE_SEEK_NEGATIVE="$negative" bash Tools/NativeSeekLatencyTests/run.sh > "$negative_log" 2>&1
            negative_status=$?
            set -e
            cat "$negative_log"
            test "$negative_status" -eq 1
            negative_dir="$(sed -n 's/^Artifacts: //p' "$negative_log" | tail -1)"
            python3 -B Tools/NativeSeekLatencyTests/verify.py negative "$negative_dir" "$negative"
          done

      - name: Preserve native exact seek evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-seek-evidence-${{ github.sha }}
          path: |
            build/native-seek-latency.*/*.txt
            build/native-seek-latency.*/*.sha256
            build/native-seek-latency.*/*.log
            build/native-seek-latency.*/*.json
            build/native-seek-latency.*/NativePlaybackSession.swift
          if-no-files-found: warn
          retention-days: 14

      - name: Test native rate changes after real EOF
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 5
        run: |
          export FFMPEG_BIN="$PWD/deps/executable/ffmpeg"
          bash Tools/NativeRateEOFTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=address bash Tools/NativeRateEOFTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeRateEOFTests/run.sh
          negative_log="$(mktemp "$RUNNER_TEMP/native-rate-eof-negative.XXXXXX")"
          set +e
          NATIVE_RATE_EOF_NEGATIVE=1 bash Tools/NativeRateEOFTests/run.sh > "$negative_log" 2>&1
          negative_status=$?
          set -e
          cat "$negative_log"
          test "$negative_status" -eq 1
          negative_dir="$(sed -n 's/^Artifacts: //p' "$negative_log" | tail -1)"
          python3 -B Tools/NativeRateEOFTests/verify_negative.py "$negative_dir"

      - name: Preserve native rate-at-EOF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-rate-eof-evidence-${{ github.sha }}
          path: |
            build/native-rate-eof.*/*.txt
            build/native-rate-eof.*/*.sha256
            build/native-rate-eof.*/*.log
            build/native-rate-eof.*/dependency-runtime.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve native core test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-core-test-evidence-${{ github.sha }}
          path: |
            build/native-playback-session-tests.*/results.log
            build/native-playback-session-tests.*/mode.txt
            build/native-playback-session-tests.*/source-sha256.txt
            build/native-playback-session-tests.*/source-validation.log
            build/native-playback-session-tests.*/fixture-sha256.txt
            build/native-playback-session-tests.*/fixture-validation.log
            build/native-playback-session-tests.*/dependency-*.txt
            build/native-playback-session-tests.*/dependency-*.log
            build/native-playback-session-tests.*/dependency-*.json
            build/native-playback-rendered-tests.*/results.log
            build/native-playback-rendered-tests.*/*-sha256.txt
            build/native-playback-rendered-tests.*/*-validation.log
            build/native-playback-rendered-tests.*/dependency-*.txt
            build/native-playback-rendered-tests.*/dependency-*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Test native resume records and real MPV compatibility
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 10
        run: |
          export FFMPEG_BIN="$PWD/deps/executable/ffmpeg"
          bash Tools/NativeResumeInteropTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeResumeInteropTests/run.sh
          bash Tools/NativeResumeStoreTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeResumeStoreTests/run.sh
          bash Tools/NativeResumeServiceTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeResumeServiceTests/run.sh

      - name: Test owned final native shutdown snapshots
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 8
        run: |
          export FFMPEG_BIN="$PWD/deps/executable/ffmpeg"
          bash Tools/NativeResumeSessionTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeResumeSessionTests/run.sh
          for control in drop-owner allow-preroll drop-cancellation duplicate-callback capture-after-reset; do
            NATIVE_RESUME_SESSION_NEGATIVE="$control" bash Tools/NativeResumeSessionTests/run.sh
          done

      - name: Test native resume lifecycle and actual queue restoration
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && (success() || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 12
        run: |
          export FFMPEG_BIN="$PWD/deps/executable/ffmpeg"
          bash Tools/NativeResumeCoreTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeResumeCoreTests/run.sh
          for control in drop-exit-save drop-preview-checkpoint; do
            NATIVE_RESUME_CORE_NEGATIVE="$control" bash Tools/NativeResumeCoreTests/run.sh
          done
          bash Tools/NativeQueueResumeTests/run.sh
          NATIVE_PLAYBACK_SANITIZER=thread bash Tools/NativeQueueResumeTests/run.sh
          for control in unopened-origin forget-saved-speed forget-speed-intent forget-seek-upgrade captured-rate-not-authoritative; do
            NATIVE_QUEUE_RESUME_NEGATIVE_CONTROL="$control" bash Tools/NativeQueueResumeTests/run.sh
          done
          python3 -B Tools/PlaybackBackendRoutingTests/run.py --queue-resume-only
          python3 -B Tools/PlaybackBackendRoutingTests/run.py --queue-resume-only --sanitize thread
          python3 -B Tools/PlaybackBackendRoutingTests/run.py --negative-control queue-resume-restart

      - name: Preserve native resume and queue restoration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
