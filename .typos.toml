[files]
extend-exclude = [
    ".git/",
    "deps/",
    "iina.xcodeproj/",
    "**/*.strings",
    # Keep the checksum-verified upstream snapshot unchanged.
    "Tools/DownloaderHelper/vendor/rednote/**",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "\\bBig Sur\\b",
    '(firstItem|secondItem|id|destination|headerView)="[0-9A-Za-z]+-[0-9A-Za-z]+-[0-9A-Za-z]+"',
    'apiKey = "[^"]+"',
    "V\\[alue\\]",
    "ba!",
    # Ignore the token declaration in AssrtSubtitle.
    "5IzWrb.*"
]

[default.extend-words]
"abitrate" = "abitrate"
# Exact name of the bundled Python CA certificate package.
"certifi" = "certifi"
"splitted" = "splitted"

[default.extend-identifiers]
"caf" = "caf"
# Plural image-format acronym, not the unrelated word fragment "PN".
"PNGs" = "PNGs"
# Xcode uses this property in XIBs.
"customObjectInstantitationMethod" = "customObjectInstantitationMethod"
"iy" = "iy"
"reloadSavedIINAfilters" = "reloadSavedIINAfilters"
"ScreenshootOSDView" = "ScreenshootOSDView"
"tak" = "tak"
"videoParamsMaxCll" = "videoParamsMaxCll"
"CPSProcessSerNum" = "CPSProcessSerNum"
